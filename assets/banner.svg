<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="45%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Vibrant Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Cyan Glow Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.3" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.75" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3" />
      <circle cx="40" cy="40" r="1" fill="#64748b" fill-opacity="0.25" />
    </pattern>

    <!-- Filter for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .banner-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .banner-subtitle {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 16px;
      fill: #94a3b8;
      letter-spacing: 0.2px;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 12px;
      fill: #38bdf8;
      letter-spacing: 0.5px;
    }
    .card-label {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    .card-desc {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 11px;
      fill: #64748b;
    }

    /* Keyframe Animations */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.08); }
    }
    @keyframes floatOrb1 {
      0%, 100% { transform: translate(0px, 0px); }
      50% { transform: translate(30px, -20px); }
    }
    @keyframes floatOrb2 {
      0%, 100% { transform: translate(0px, 0px); }
      50% { transform: translate(-25px, 25px); }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes cardFloat1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes cardFloat2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-9px); }
    }
    @keyframes radarSweep {
      0% { opacity: 0.2; transform: rotate(0deg); }
      50% { opacity: 0.5; }
      100% { opacity: 0.2; transform: rotate(360deg); }
    }

    .anim-pulse {
      animation: pulseGlow 6s ease-in-out infinite;
      transform-origin: center;
    }
    .anim-orb-1 {
      animation: floatOrb1 8s ease-in-out infinite;
    }
    .anim-orb-2 {
      animation: floatOrb2 10s ease-in-out infinite;
    }
    .anim-flow {
      stroke-dasharray: 20, 10;
      animation: flowLine 14s linear infinite;
    }
    .anim-card-1 {
      animation: cardFloat1 5s ease-in-out infinite;
    }
    .anim-card-2 {
      animation: cardFloat2 6s ease-in-out infinite 0.8s;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="340" rx="16" fill="url(#bgGradient)" />

  <!-- Background Grid -->
  <rect width="1200" height="340" rx="16" fill="url(#grid)" />

  <!-- Animated Glowing Ambience Orbs (Kept behind foreground content) -->
  <g class="anim-orb-1">
    <circle cx="1020" cy="100" r="140" fill="#6366f1" fill-opacity="0.15" filter="url(#glow)" />
  </g>
  <g class="anim-orb-2">
    <circle cx="850" cy="240" r="110" fill="#06b6d4" fill-opacity="0.12" filter="url(#glow)" />
  </g>
  <circle cx="120" cy="60" r="120" fill="#a855f7" fill-opacity="0.08" class="anim-pulse" />

  <!-- Dynamic Animated Pipeline Stream in Background -->
  <g opacity="0.45">
    <path d="M 620 270 C 720 270, 750 170, 850 170 C 950 170, 980 120, 1100 120" 
          fill="none" stroke="url(#accentGrad)" stroke-width="2.5" class="anim-flow" />
    <path d="M 620 290 C 740 290, 780 210, 890 210 C 1000 210, 1040 160, 1150 160" 
          fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" class="anim-flow" style="animation-duration: 20s;" />
  </g>

  <!-- Right Decorative Interactive Cards (Dynamic recruitment workflow representation) -->
  <g class="anim-card-1">
    <rect x="800" y="55" width="340" height="74" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
    <circle cx="832" cy="92" r="18" fill="#38bdf8" fill-opacity="0.15" />
    <!-- Candidate Search Icon -->
    <path d="M 827 88 A 5 5 0 1 1 837 88 A 5 5 0 1 1 827 88 M 835 93 L 840 98" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <text x="862" y="86" class="card-label">Sourcing &amp; Pipeline ATS</text>
    <text x="862" y="105" class="card-desc">Candidate Matching • Resumes • CRM Portals</text>
    <circle cx="1115" cy="75" r="4" fill="#10b981" />
  </g>

  <g class="anim-card-2">
    <rect x="760" y="150" width="360" height="74" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
    <circle cx="792" cy="187" r="18" fill="#a855f7" fill-opacity="0.15" />
    <!-- Agency Match Flow Icon -->
    <path d="M 786 187 L 798 187 M 794 182 L 799 187 L 794 192" fill="none" stroke="#c084fc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="822" y="181" class="card-label">Agency &amp; Staffing Operations</text>
    <text x="822" y="200" class="card-desc">Client Job Orders • Submissions • Timesheets</text>
    <circle cx="1095" cy="170" r="4" fill="#38bdf8" />
  </g>

  <g class="anim-card-1" style="animation-duration: 7s;">
    <rect x="820" y="245" width="310" height="60" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
    <circle cx="848" cy="275" r="14" fill="#10b981" fill-opacity="0.15" />
    <path d="M 843 275 L 847 279 L 854 271" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="872" y="271" class="card-label">Open-Source &amp; Cloud SaaS</text>
    <text x="872" y="288" class="card-desc">Complete Stack &amp; Pricing Directory</text>
  </g>

  <!-- FOREGROUND: Header Content (Unobstructed, crystal clear readability) -->
  <g transform="translate(60, 48)">
    <!-- Category Pill Badge -->
    <rect x="0" y="0" width="230" height="28" rx="14" fill="#0369a1" fill-opacity="0.25" stroke="#0284c7" stroke-width="1" />
    <circle cx="14" cy="14" r="4" fill="#38bdf8" />
    <text x="26" y="18" class="badge-text">CURATED RECRUITMENT STACK</text>

    <!-- Main Title -->
    <text x="0" y="75" class="banner-title">Awesome Talent Acquisition</text>
    <text x="0" y="125" class="banner-title" fill="url(#accentGrad)">&amp; Staffing Software</text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="172" class="banner-subtitle">Enterprise Staffing CRMs, Applicant Tracking Systems (ATS), and</text>
    <text x="0" y="196" class="banner-subtitle">Production-Ready Open-Source Recruitment Platforms.</text>

    <!-- Quick Stat Badges -->
    <g transform="translate(0, 222)">
      <rect x="0" y="0" width="118" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="12" y="17" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#38bdf8">10+ SaaS ATS</text>

      <rect x="128" y="0" width="138" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="140" y="17" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#a855f7">Open-Source Stack</text>

      <rect x="276" y="0" width="154" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="288" y="17" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#10b981">Verified Pricing &amp; Stars</text>
    </g>
  </g>
</svg>
